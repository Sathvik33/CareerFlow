version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: careerflow_pgvector
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Sathvik@333
      POSTGRES_DB: careerflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
